version: 1
formatters:
  structured: 
    format: '{"timestamp": "%(asctime)s",\n"filename": %(filename)s,\n"levelname": "%(levelname)s",\n"message": %(message)s}'
    datefmt: "%Y-%m-%d %H:%M:%S"
  default:
    format: "%(asctime)s | [%(levelname)s]: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
handlers:
  file:
    class: logging.FileHandler
    filename: bot.log
    level: logging.DEBUG
    formatter: structured
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    level: logging.INFO
logger:
  main:
    level: logging.DEBUG
    handlers: [file, console]
    propagate: no

